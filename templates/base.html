<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block titulo %}LATENTE Finanzas{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

  <header class="barra-superior">
    <div class="contenido">
      <a class="marca" href="{{ url_for('index') }}">
        <span class="isotipo">L</span>
        <span class="nombre">
          <strong>LATENTE</strong>
          <span>Finanzas</span>
        </span>
      </a>

      <nav class="nav-escritorio">
        <a href="{{ url_for('index') }}" class="{{ 'activo' if request.endpoint == 'index' }}">Inicio</a>
        <a href="{{ url_for('diagnostico') }}" class="{{ 'activo' if request.endpoint == 'diagnostico' }}">Diagnóstico</a>
        <a href="{{ url_for('costos') }}" class="{{ 'activo' if request.endpoint == 'costos' }}">Costos</a>
        <a href="{{ url_for('flujo_caja') }}" class="{{ 'activo' if request.endpoint == 'flujo_caja' }}">Flujo de caja</a>
        <a href="{{ url_for('financiamiento') }}" class="{{ 'activo' if request.endpoint == 'financiamiento' }}">Financiamiento</a>
        <a href="{{ url_for('dashboard') }}" class="{{ 'activo' if request.endpoint == 'dashboard' }}">Dashboard</a>
            <a class="{{ 'active' if active_path == '/indicadores-sena' else '' }}" href="/indicadores-sena">Indicadores SENA</a>
      </nav>

      {% block paso_indicador %}{% endblock %}
    </div>
  </header>

  <main class="app-shell">
    {% block contenido %}{% endblock %}
  </main>

  <nav class="nav-inferior no-imprimir">
    <a href="{{ url_for('index') }}" class="{{ 'activo' if request.endpoint == 'index' }}">
      <span class="icono">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      </span>
      Inicio
    </a>
    <a href="{{ url_for('diagnostico') }}" class="{{ 'activo' if request.endpoint == 'diagnostico' }}">
      <span class="icono">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
      </span>
      Datos
    </a>
    <a href="{{ url_for('costos') }}" class="{{ 'activo' if request.endpoint == 'costos' }}">
      <span class="icono">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h2M12 12h2M16 12h2M8 16h2M12 16h2M16 16h2"/></svg>
      </span>
      Costos
    </a>
    <a href="{{ url_for('flujo_caja') }}" class="{{ 'activo' if request.endpoint == 'flujo_caja' }}">
      <span class="icono">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>
      </span>
      Caja
    </a>
    <a href="{{ url_for('dashboard') }}" class="{{ 'activo' if request.endpoint in ['dashboard', 'financiamiento', 'recomendaciones'] }}">
      <span class="icono">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
      </span>
      Panel
    </a>
  </nav>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
